[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faceless-studio"
version = "0.1.0"
description = "Local-first pipeline for original narrated vertical documentary videos"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "typer>=0.15",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# Local speech models. Install CPU torch first (see .devcontainer/install-ai-deps.sh).
ai = ["kokoro>=0.9", "faster-whisper>=1.1", "soundfile>=0.12"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
faceless = "faceless_studio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faceless_studio = ["templates/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: runs real FFmpeg (no models)",
  "models: needs installed Kokoro / faster-whisper models",
  "ollama: needs a reachable Ollama with the configured model",
]
addopts = "-m 'not models and not ollama'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S603", "S607", "S608", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
